name: policygraph

# Local PostgreSQL only. No other infrastructure is needed for the MVP.
services:
  postgres:
    image: postgres:16
    container_name: policygraph-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: policygraph
      POSTGRES_PASSWORD: policygraph
      POSTGRES_DB: policygraph
    ports:
      # Override the host port per machine with POSTGRES_HOST_PORT when 5432
      # is already taken (e.g. POSTGRES_HOST_PORT=5433 docker compose up -d).
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U policygraph -d policygraph"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
